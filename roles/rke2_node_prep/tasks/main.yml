---
- name: Verify a Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: This RKE2 preparation lab currently supports Debian-family hosts only.

- name: Install RKE2 host prerequisites
  ansible.builtin.apt:
    name: "{{ rke2_node_prep_required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable active swap when present
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: ansible_swaptotal_mb | int > 0

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(.*\s+swap\s+.*)$'
    replace: '# \1'

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load required kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure Kubernetes networking sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - name: net.bridge.bridge-nf-call-iptables
      value: "1"
    - name: net.bridge.bridge-nf-call-ip6tables
      value: "1"
    - name: net.ipv4.ip_forward
      value: "1"

- name: Enable and start iSCSI daemon
  ansible.builtin.service:
    name: iscsid
    enabled: true
    state: started
