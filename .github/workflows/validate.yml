---
name: Validate

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install --requirement requirements-ci.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Run YAML lint
        run: yamllint .

      - name: Run Ansible lint
        run: ansible-lint

      - name: Run playbook syntax checks
        run: ansible-playbook --syntax-check playbooks/site.yml

  common-role-idempotency:
    name: Common role idempotency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install "ansible-core>=2.17,<2.20"

      - name: Converge common role
        run: ansible-playbook --inventory tests/inventory.ci.ini playbooks/common-setup.yml

      - name: Verify second run makes no changes
        shell: bash
        run: |
          set -o pipefail
          ansible-playbook --inventory tests/inventory.ci.ini playbooks/common-setup.yml | tee /tmp/second-run.log
          if grep -Eq 'changed=[1-9][0-9]*' /tmp/second-run.log; then
            echo "Idempotency check failed: the second run reported changes."
            exit 1
          fi
